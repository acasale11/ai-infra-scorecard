<text x="778" y="565" font-size="12" font-weight="600" fill="#52514e">2.22x dearer</text>
<text x="78" y="586" font-size="12" fill="#52514e">index 30</text>
<text x="228" y="586" font-size="12" fill="#52514e">glm-5.3   $0.380</text>
<text x="498" y="586" font-size="12" fill="#52514e">claude-haiku-5.5   $0.167</text>
<text x="778" y="586" font-size="12" font-weight="600" fill="#52514e">2.3x cheaper</text>
