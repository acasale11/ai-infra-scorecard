<text x="78" y="646" font-size="13" font-weight="600" fill="#0b0b0b">How much the answer depends on which price you can actually get</text>
<text x="78" y="668" font-size="11.5" fill="#898781">Price basis</text>
<text x="328" y="668" font-size="11.5" fill="#898781">Models</text>
<text x="508" y="668" font-size="11.5" fill="#898781">Cheapest open at index 25</text>
<text x="718" y="668" font-size="11.5" fill="#898781">Open advantage</text>
<text x="878" y="668" font-size="11.5" fill="#898781">Crossover</text>
<line x1="78" y1="675" x2="940" y2="675" stroke="#e1e0d9"/>
<text x="78" y="695" font-size="12" font-weight="400" fill="#52514e">Cheapest, any precision  (lower bound)</text>
<text x="328" y="695" font-size="12" font-weight="400" fill="#52514e">35</text>
<text x="508" y="695" font-size="12" font-weight="400" fill="#52514e">$0.039</text>
<text x="718" y="695" font-size="12" font-weight="400" fill="#52514e">4.26x cheaper</text>
<text x="878" y="695" font-size="12" font-weight="400" fill="#52514e">29.9</text>
<text x="78" y="715" font-size="12" font-weight="600" fill="#52514e">Cheapest at fp8 or better  (base case)</text>
<text x="328" y="715" font-size="12" font-weight="600" fill="#52514e">34</text>
<text x="508" y="715" font-size="12" font-weight="600" fill="#52514e">$0.075</text>
<text x="718" y="715" font-size="12" font-weight="600" fill="#52514e">2.22x cheaper</text>
<text x="878" y="715" font-size="12" font-weight="600" fill="#52514e">29.9</text>
<text x="78" y="735" font-size="12" font-weight="400" fill="#52514e">Author list price  (upper bound)</text>
<text x="328" y="735" font-size="12" font-weight="400" fill="#52514e">29</text>
<text x="508" y="735" font-size="12" font-weight="400" fill="#52514e">$0.163</text>
<text x="718" y="735" font-size="12" font-weight="400" fill="#52514e">1.02x cheaper</text>
<text x="878" y="735" font-size="12" font-weight="400" fill="#52514e">27.8</text>
<text x="78" y="765" font-size="11.5" fill="#898781">The discount depends heavily on the basis. The crossover does not move: it is set by open models running out of capability at 31.7,</text>
<text x="78" y="781" font-size="11.5" fill="#898781">not by price. It also holds across every token mix tested, from output-only to 20:1.</text>
<text x="78" y="782" font-size="11.5" fill="#898781">34 scored base SKUs at the base case. Standard-tier endpoints only. Undeclared precision counts as fp8 or better, since closed providers rarely disclose it.</text>
<text x="78" y="798" font-size="11.5" fill="#898781">Capability index may lag recent releases and covers 54 of 430 priced models. This compares off-the-shelf models at API prices, not post-trained or self-hosted ones.</text>
