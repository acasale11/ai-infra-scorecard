name: Weekly collection

# Runs every collector that exists, appends what is new, regenerates the
# chart, writes a plain-English summary to notes/weekly/ and commits.
#
# A collector that fails does not stop the others. Each one records its own
# exit code and the run opens a single issue at the end listing whatever
# broke, so one dead source does not cost a week of the others' data.
#
# Nothing here interprets a number. Thresholds open an issue saying a week
# is worth a look; that is all an automated check can honestly claim.

on:
  schedule:
    # Mondays at 11:00 UTC. The ICE BofA series publish with a day or two
    # of lag, so a Monday run picks up the whole of the previous week.
    - cron: "0 11 * * 1"
  workflow_dispatch:

# Least privilege: commit the data, open an issue when something needs a
# human. Nothing else.
permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # No collector needs a key today: OpenRouter's models API, FRED's CSV
      # endpoint and SEC EDGAR are all public. These are wired through so
      # that setting a secret is the only step needed if that changes.
      # An unset secret arrives as an empty string and every script falls
      # back to its documented default.
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set the collection date
        run: echo "RUN_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Run the collectors
        id: collect
        run: |
          set -u
          failures=""
          run_step () {
            name="$1"; shift
            echo "::group::$name"
            if "$@"; then
              echo "$name ok"
            else
              code=$?
              echo "$name FAILED with exit $code"
              failures="${failures}- \`${name}\` exited ${code}\n"
            fi
            echo "::endgroup::"
          }

          # Credit benchmarks. Independent of everything else.
          run_step "collect_fred" python scripts/collect_fred.py --date "$RUN_DATE"

          # Issuer filings. Deduplicated by accession, so most weeks this
          # reads seven submission indexes and writes nothing.
          run_step "extract_filings" python scripts/extract_filings.py --date "$RUN_DATE"

          # Token prices. These run in order and each needs the one before,
          # so a failure early will cascade. The cascade is reported rather
          # than hidden, which is the point of collecting every exit code.
          run_step "collect_openrouter" python scripts/collect_openrouter.py --date "$RUN_DATE"
          run_step "classify_weights" python scripts/classify_weights.py --date "$RUN_DATE"
          run_step "verify_prices" python scripts/verify_prices.py --date "$RUN_DATE"
          run_step "price_bases" python scripts/price_bases.py --date "$RUN_DATE"
          run_step "make_chart" python scripts/make_chart.py --date "$RUN_DATE"

          # Estimated next filing dates for the coverage universe, so the
          # brief can say who reports soon. Rewritten each run rather than
          # appended, because it is a projection and not a measurement.
          run_step "earnings_calendar" python scripts/earnings_calendar.py --date "$RUN_DATE"

          # Derived, and cheap to rebuild from the CSVs.
          run_step "build_db" python scripts/build_db.py

          if [ -n "$failures" ]; then
            {
              echo "failures<<EOF"
              printf "%b" "$failures"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Check thresholds
        id: alerts
        run: |
          python scripts/check_alerts.py --date "$RUN_DATE" --out alerts.md
          if [ -f alerts.md ]; then echo "fired=true" >> "$GITHUB_OUTPUT"; fi

      - name: Write the weekly brief
        run: |
          python scripts/weekly_brief.py --date "$RUN_DATE" --alerts alerts.md --issue brief.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed, no commit"
            exit 0
          fi
          git commit -m "Weekly collection $RUN_DATE" \
                     -m "Automated run of the collectors. Rows appended, chart regenerated, summary written to notes/weekly/$RUN_DATE.md. No existing rows modified."
          git push

      - name: Open an issue if a collector failed
        if: steps.collect.outputs.failures != ''
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed as an environment variable rather than interpolated into
          # the script body, so the text can never be read as shell.
          FAILURES: ${{ steps.collect.outputs.failures }}
        run: |
          {
            echo "The weekly run on $RUN_DATE had one or more collectors fail."
            echo
            printf "%s\n" "$FAILURES"
            echo
            echo "Whatever succeeded has been committed. Nothing was overwritten."
            echo
            echo "[Run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > issue.md
          gh issue create \
            --title "Weekly collection $RUN_DATE: collector failure" \
            --body-file issue.md \
            --assignee "${{ github.repository_owner }}" \
            --label "automated" || \
          gh issue create \
            --title "Weekly collection $RUN_DATE: collector failure" \
            --body-file issue.md \
            --assignee "${{ github.repository_owner }}"

      # The brief is the email. It carries the alerts in its third
      # section, so a separate threshold issue would arrive as a duplicate
      # of something the owner has already read.
      - name: Post the weekly brief as an issue
        if: always() && hashFiles('brief.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh issue create             --title "Weekly brief: $RUN_DATE"             --body-file brief.md             --assignee "${{ github.repository_owner }}")
          echo "opened $url"
          new="${url##*/}"

          # Close last week's, so the issue list holds one brief at a time
          # and the open one is always the current week.
          gh issue list --state open --search "Weekly brief in:title"             --json number --jq '.[].number' | while read -r n; do
            if [ -n "$n" ] && [ "$n" != "$new" ]; then
              gh issue close "$n"                 --comment "Superseded by the brief for $RUN_DATE."                 --reason completed
              echo "closed #$n"
            fi
          done

      - name: Open an issue if the run itself failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Weekly collection $RUN_DATE: the run failed" \
            --body "The weekly workflow failed outside the collectors, so the usual per-collector reporting did not run. [Run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            --assignee "${{ github.repository_owner }}"
